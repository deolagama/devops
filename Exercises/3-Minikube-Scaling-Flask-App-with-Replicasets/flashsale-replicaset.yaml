apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flashsale-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flashsale
  template:
    metadata:
      labels:
        app: flashsale
    spec:
      containers:
        - name: flashsale
          image: flashsale:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flashsale-svc
spec:
  type: ClusterIP
  selector:
    app: flashsale
  ports:
    - port: 80
      targetPort: 5000
